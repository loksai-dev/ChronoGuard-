server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /assets/ {
    alias /usr/share/nginx/html/;
  }

  location /health { proxy_pass http://api:8000; }
  location /metrics { proxy_pass http://api:8000; }
  location /incidents { proxy_pass http://api:8000; }

  location / {
    try_files $uri /index.html;
  }
}
